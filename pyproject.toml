[project]
name = "dpia-privacy-impact-assessment"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "Django>=5.0,<7.0",
    "reportlab>=4.0",
    "django-ratelimit>=4.1",
    "dj-database-url>=2.1",
    "psycopg[binary]>=3.1",
    "whitenoise>=6.6",
]

[tool.black]
line-length = 96
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 96

[tool.ruff]
line-length = 96
target-version = "py312"

[tool.ruff.lint]
# E4/E7/E9/F is ruff's own default selection - deliberately excludes E501
# (line-too-long), since black already owns code line-length and this
# codebase has plenty of long, single-line descriptive strings (help_text,
# seed data) that are more readable unwrapped than force-split. Add I
# (import sorting - redundant with isort, but catches drift if one runs
# without the other), C4 (comprehension cleanups) and DTZ
# (timezone-naive datetime.now()).
select = ["E4", "E7", "E9", "F", "I", "C4", "DTZ", "RUF"]

[tool.ruff.lint.per-file-ignores]
# `app` is the module-level name Vercel's Python runtime looks for as the
# WSGI entrypoint - it's not unused, ruff just can't see that caller.
"api/index.py" = ["F401"]
# Auto-generated by `manage.py makemigrations` - never hand-edited, so
# its list/dict literals aren't worth restructuring for this rule.
"dpia/migrations/*.py" = ["RUF012"]

[tool.mypy]
plugins = ["mypy_django_plugin.main"]
python_version = "3.12"

[[tool.mypy.overrides]]
# Ship no py.typed marker / stubs; not this project's code to fix.
module = ["django_ratelimit.*", "reportlab.*"]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "config.settings"

[tool.coverage.run]
source = ["dpia"]
omit = ["dpia/migrations/*", "dpia/tests.py"]
