# Render Blueprint (Infrastructure as Code) — Render → New → Blueprint,
# pointing at this repo, provisions both services below in one step.
# See the README's Deployment section for the manual dashboard steps
# this replaces, and for the environment variables that still need to be
# filled in by hand (DJANGO_SECRET_KEY, DJANGO_ALLOWED_HOSTS).
services:
  - type: web
    name: dpia-privacy-impact-assessment
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt && python manage.py migrate"
    startCommand: "gunicorn config.wsgi:application"
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: dpia-privacy-impact-assessment-db
          property: connectionString

databases:
  - name: dpia-privacy-impact-assessment-db
    plan: free
